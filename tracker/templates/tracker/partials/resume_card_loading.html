<div class="bg-darkCard border border-darkBorder rounded-2xl p-5 flex flex-col gap-4 relative justify-center items-center py-10"
     hx-get="{% url 'check_resume_status' resume.id %}" 
     hx-trigger="every 2s" 
     hx-swap="outerHTML">
    
    <!-- Spinner loader -->
    <div class="w-8 h-8 border-3 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-2"></div>
    
    <div class="text-center space-y-1">
        <h3 class="font-bold text-slate-200 text-sm">Parsing Resume...</h3>
        <p class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider">{{ resume.version_name }}</p>
    </div>
    
    <span class="px-2 py-0.5 rounded bg-darkBg text-slate-500 text-[10px] font-bold uppercase border border-darkBorder">
        Processing
    </span>
</div>
