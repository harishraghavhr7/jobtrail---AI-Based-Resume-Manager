services:
  # Web Application Service (Django)
  - type: web
    name: jobtrail-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn jobtrail.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jobtrail-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false # Set this key in the Render Dashboard UI Settings
      - key: SECRET_KEY
        generateValue: true

  # Celery Background Worker
  - type: worker
    name: jobtrail-worker
    env: python
    buildCommand: "./build.sh"
    startCommand: "celery -A jobtrail worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jobtrail-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  # Redis Broker
  - type: redis
    name: jobtrail-redis
    ipAllowList: [] # Only allow internal network connection for security

databases:
  # Managed PostgreSQL Database
  - name: jobtrail-db
    databaseName: jobtrail
    user: db_user
