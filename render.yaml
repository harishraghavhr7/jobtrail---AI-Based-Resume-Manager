services:
  # Web Application Service (Django - Free Plan)
  - type: web
    name: jobtrail-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn jobtrail.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True" # Runs Celery tasks synchronously in Gunicorn (eliminates Redis/Worker requirements)
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrail-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false # Set this in the Render Dashboard UI Settings
      - key: SECRET_KEY
        generateValue: true

databases:
  # Managed PostgreSQL Database (Free Plan)
  - name: jobtrail-db
    databaseName: jobtrail
    user: db_user
    plan: free
